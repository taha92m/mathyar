<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e4ff"/>
      <stop offset="1" stop-color="#d7f6ec"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#8f74ff"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a742"/>
    </linearGradient>
    <clipPath id="frame"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="56" r="42" fill="#fff" opacity="0.42"/>
    <circle cx="24" cy="106" r="22" fill="#b9f0dc" opacity="0.7"/>
    <circle cx="108" cy="26" r="16" fill="#cfc4ff" opacity="0.75"/>

    <!-- بدن و هودی -->
    <path d="M14 128c2-24 18-38 40-42h20c22 4 38 18 40 42Z" fill="url(#hoodie)"/>
    <path d="M54 88 64 102 74 88c-3-2-7-3-10-3s-7 1-10 3Z" fill="#ffffff" opacity="0.28"/>
    <path d="M60 128c2-14 4-20 4-20h0s2 6 4 20Z" fill="#ffffff" opacity="0.18"/>

    <!-- گردن -->
    <rect x="56" y="76" width="16" height="18" rx="7" fill="#efbe9b"/>

    <!-- گوشها -->
    <circle cx="40" cy="60" r="6" fill="#f6c9a8"/>
    <circle cx="88" cy="60" r="6" fill="#f6c9a8"/>

    <!-- صورت -->
    <ellipse cx="64" cy="57" rx="24" ry="27" fill="#ffd8b8"/>

    <!-- مو -->
    <path d="M39 55c-1-19 10-31 25-31s26 12 25 31c-4-10-9-15-15-17-4 5-13 7-21 5-6 3-10 7-14 12Z" fill="#3b2b2e"/>
    <path d="M39 55c-2-6-1-12 2-17 1 7 3 11 6 14Z" fill="#3b2b2e"/>
    <path d="M89 55c2-6 1-12-2-17-1 7-3 11-6 14Z" fill="#3b2b2e"/>

    <!-- ابروها و چشمها -->
    <path d="M47 47q7-4 13 0" stroke="#3b2b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M68 47q7-4 13 0" stroke="#3b2b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="54" cy="57" r="3.6" fill="#2b2f57"/>
    <circle cx="74" cy="57" r="3.6" fill="#2b2f57"/>
    <circle cx="55.2" cy="55.8" r="1.1" fill="#fff"/>
    <circle cx="75.2" cy="55.8" r="1.1" fill="#fff"/>

    <!-- گونهها و لبخند -->
    <circle cx="46" cy="66" r="4.5" fill="#ff9aa2" opacity="0.35"/>
    <circle cx="82" cy="66" r="4.5" fill="#ff9aa2" opacity="0.35"/>
    <path d="M55 69q9 9 18 0" stroke="#c56b6b" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- مداد -->
    <g transform="rotate(24 96 100)">
      <rect x="92" y="78" width="8" height="34" rx="2" fill="url(#pencil)"/>
      <path d="M92 78h8l-4-6Z" fill="#f0c9a0"/>
      <path d="M93.6 74.5 96 72l2.4 2.5Z" fill="#3b2b2e"/>
      <rect x="92" y="104" width="8" height="6" rx="2" fill="#ff9aa2"/>
    </g>

    <!-- جرقه ریاضی -->
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#6c5ce7" opacity="0.85">+</text>
  </g>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
</svg>
